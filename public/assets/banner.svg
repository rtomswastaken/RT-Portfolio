<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020813"/>
      <stop offset="40%" stop-color="#07152b"/>
      <stop offset="70%" stop-color="#122b4d"/>
      <stop offset="90%" stop-color="#1d3f6a"/>
      <stop offset="100%" stop-color="#2a5282"/>
    </linearGradient>

    <!-- Mountain Layer Gradients -->
    <linearGradient id="mountBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c213d"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>

    <linearGradient id="mountMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08182d"/>
      <stop offset="100%" stop-color="#030a14"/>
    </linearGradient>

    <linearGradient id="mountFore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040e1b"/>
      <stop offset="100%" stop-color="#010408"/>
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5d8ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#58a6ff" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#1f6feb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#09356d" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="glow" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#388bfd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Pixel Font styling -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=JetBrains+Mono:wght@300;500;700&amp;display=swap');
      .title-text {
        font-family: 'Press Start 2P', monospace, monospace;
        font-size: 24px;
        fill: #dbeafe;
        letter-spacing: 4px;
        text-shadow: 0 0 12px rgba(88, 166, 255, 0.6), 0 0 24px rgba(56, 139, 253, 0.4);
      }
      .sub-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        fill: #79c0ff;
        letter-spacing: 3px;
        text-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
      }
    </style>
  </defs>

  <!-- Sky Background -->
  <rect width="1000" height="280" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="95" cy="42" r="1"/>
    <circle cx="160" cy="85" r="0.8"/>
    <circle cx="230" cy="30" r="1.2"/>
    <circle cx="340" cy="65" r="0.9"/>
    <circle cx="480" cy="35" r="1"/>
    <circle cx="620" cy="50" r="1.1"/>
    <circle cx="750" cy="38" r="0.9"/>
    <circle cx="840" cy="70" r="1.3"/>
    <circle cx="910" cy="45" r="0.8"/>
    <circle cx="50" cy="110" r="0.8"/>
    <circle cx="940" cy="105" r="1"/>
  </g>

  <!-- Soft Horizon Center Glow -->
  <ellipse cx="500" cy="150" rx="360" ry="120" fill="url(#glow)"/>

  <!-- Distant Mountains -->
  <path d="M 0 175 Q 160 145 290 160 T 500 162 T 710 155 Q 860 140 1000 175 L 1000 280 L 0 280 Z" fill="url(#mountBack)"/>

  <!-- Midground Mountains -->
  <path d="M 0 190 Q 140 160 310 178 Q 430 190 480 182 L 500 182 Q 550 190 690 175 Q 850 155 1000 190 L 1000 280 L 0 280 Z" fill="url(#mountMid)"/>

  <!-- Center Winding River -->
  <path d="M 496 172 
           C 494 185, 480 198, 490 215 
           C 502 232, 540 242, 520 260 
           C 510 270, 485 275, 470 280 
           L 550 280 
           C 565 275, 570 262, 555 248 
           C 535 230, 520 215, 516 195 
           C 512 182, 506 175, 504 172 Z" 
        fill="url(#riverGrad)"/>

  <!-- Foreground Silhouettes (Left & Right Foothills) -->
  <path d="M 0 220 Q 180 200 380 240 Q 450 255 470 280 L 0 280 Z" fill="url(#mountFore)"/>
  <path d="M 1000 215 Q 820 195 620 242 Q 560 258 545 280 L 1000 280 Z" fill="url(#mountFore)"/>

  <!-- Center Text -->
  <!-- Main Pixel Name -->
  <text x="500" y="98" text-anchor="middle" class="title-text">richardsen  thomas</text>
  <!-- Subtitle Tag -->
  <text x="500" y="132" text-anchor="middle" class="sub-text">&lt;/&gt;</text>
</svg>
